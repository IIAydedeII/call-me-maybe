[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Introduction to function calling in LLMs"
authors = [
    { name = "Ahmet Yasin Dede", email = "ahmetyasindd@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "llm_sdk",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.2.0",
]

[tool.uv.sources]
llm_sdk = { path = "llm_sdk" }

